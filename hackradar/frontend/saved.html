<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HackRadar &mdash; Saved</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark"></div><div class="brand-name">HackRadar</div></div>
    <nav class="nav-group">
      <a class="nav-link" href="index.html">Dashboard</a>
      <a class="nav-link" href="explore.html">Explore</a>
      <a class="nav-link" href="closing-soon.html">Closing Soon</a>
      <a class="nav-link active" href="saved.html">Saved</a>
      <a class="nav-link" href="calendar.html">Calendar</a>
      <a class="nav-link" href="contests.html">Coding Contests</a>
      <a class="nav-link" href="profile.html">Profile</a>
    </nav>
    <div class="sidebar-footer">Phase 1 MVP &middot; mock data</div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>❤️ Saved Hackathons</h1>
        <div class="sub">Everything you've bookmarked, grouped by urgency.</div>
      </div>
    </div>
    <div id="saved-groups"></div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/format.js"></script>
<script src="js/cards.js"></script>
<script>
async function init() {
  const { results } = await apiGet("/saved");
  const savedIds = new Set(results.map((e) => e.id));
  const el = document.getElementById("saved-groups");

  if (results.length === 0) {
    el.innerHTML = `<div class="empty-state"><h3>Nothing saved yet</h3>Save hackathons from the Explore page to track them here.</div>`;
    return;
  }

  const closing = results.filter((e) => e.status === "CLOSING_SOON");
  const upcoming = results.filter((e) => e.status !== "CLOSING_SOON" && e.status !== "CLOSED");
  const closed = results.filter((e) => e.status === "CLOSED");

  function section(title, items) {
    if (items.length === 0) return "";
    return `
      <div class="section">
        <div class="section-head"><h2>${title}</h2></div>
        <div class="card-grid">${items.map((e) => hackCardHtml(e, savedIds)).join("")}</div>
      </div>`;
  }

  el.innerHTML =
    section("Closing soon", closing) + section("Upcoming", upcoming) + section("Already closed", closed);

  wireSaveButtons(el, (id, nowSaved) => {
    if (!nowSaved) {
      document.querySelector(`[data-event-id="${id}"]`)?.remove();
    }
  });
}
init().catch((err) => {
  console.error(err);
  document.getElementById("saved-groups").innerHTML = `<div class="empty-state"><h3>Couldn't load</h3>Check that the backend server is running.</div>`;
});
</script>
</body>
</html>
