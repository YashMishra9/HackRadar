<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HackRadar &mdash; Closing Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark"></div><div class="brand-name">HackRadar</div></div>
    <nav class="nav-group">
      <a class="nav-link" href="index.html">Dashboard</a>
      <a class="nav-link" href="explore.html">Explore</a>
      <a class="nav-link active" href="closing-soon.html">Closing Soon</a>
      <a class="nav-link" href="saved.html">Saved</a>
      <a class="nav-link" href="calendar.html">Calendar</a>
      <a class="nav-link" href="contests.html">Coding Contests</a>
      <a class="nav-link" href="profile.html">Profile</a>
    </nav>
    <div class="sidebar-footer">Phase 1 MVP &middot; mock data</div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>⏰ Closing Soon</h1>
        <div class="sub">Registration deadlines within the next 72 hours, soonest first.</div>
      </div>
    </div>
    <div id="groups"></div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/format.js"></script>
<script src="js/cards.js"></script>
<script>
async function init() {
  const [data, savedIds] = await Promise.all([apiGet("/events/closing-soon"), getSavedIds()]);
  const groupsEl = document.getElementById("groups");

  if (data.results.length === 0) {
    groupsEl.innerHTML = `<div class="empty-state"><h3>Nothing closing soon</h3>Check back later, or explore hackathons with more runway on the Explore page.</div>`;
    return;
  }

  const buckets = { Today: [], Tomorrow: [], "This week": [] };
  data.results.forEach((e) => buckets[closingBucket(e.registrationDeadline)].push(e));

  groupsEl.innerHTML = Object.entries(buckets)
    .filter(([, items]) => items.length > 0)
    .map(
      ([label, items]) => `
      <div class="closing-group">
        <div class="closing-group-label">${label}</div>
        ${items
          .map(
            (e) => `
          <div class="closing-row">
            <div>
              <div class="closing-row-title"><a href="detail.html?id=${e.id}">${escapeHtml(e.title)}</a></div>
              <div class="closing-row-meta">${modeLabel(e.mode)} \u00b7 ${escapeHtml(e.location)} \u00b7 ${e.matchScore}% match</div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
              <span class="deadline-tag ${formatDeadline(e.registrationDeadline).cls}">${formatDeadline(e.registrationDeadline).text}</span>
              <a class="btn small primary" href="detail.html?id=${e.id}">View</a>
            </div>
          </div>`
          )
          .join("")}
      </div>`
    )
    .join("");
}
init().catch((err) => {
  console.error(err);
  document.getElementById("groups").innerHTML = `<div class="empty-state"><h3>Couldn't load</h3>Check that the backend server is running.</div>`;
});
</script>
</body>
</html>
